name: build

# Standard `build` lane (per
# kaos-modules/docs/oss/40-ci-cd/runner-cost-reduction-plan.md):
# build wheel/sdist, `twine check --strict`, clean-venv smoke install.
# Linux Python 3.13 on PR / main push / tag. The release workflow
# (release.yml) is the gated artifact-publish path; this lane is the
# PR-time smoke that the artifact builds cleanly and the wheel
# installs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build wheel and sdist
        run: uv build

      - name: Verify metadata
        run: uvx --from twine twine check --strict dist/*

      - name: Smoke-test the built wheel in a clean venv
        # Install the actually-built wheel (not the source tree) into a
        # clean Python environment and exercise the public API. This
        # catches packaging bugs that source-tree tests miss: missing
        # data files, broken `__init__.py` exports, sdist-only files
        # that reference dist-only paths, etc.
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/kaos_mcp-*-py3-none-any.whl
          /tmp/smoke/bin/python -c "
          import kaos_mcp
          assert kaos_mcp.__version__, 'version missing from wheel'
          # Public API surface imports without error. kaos-mcp's
          # surface is intentionally tight — it's the FastMCP bridge,
          # not a tool-bearing module — so __all__ has 4 names.
          from kaos_mcp import (
              KaosMCPServer,
              KaosMCPSettings,
              create_app,
          )
          assert kaos_mcp.__all__ == [
              'KaosMCPServer', 'KaosMCPSettings', '__version__', 'create_app',
          ], kaos_mcp.__all__
          # KaosMCPSettings inherits from kaos_core.config.ModuleSettings
          # (audit-01 MCP-04). Verify the rebase landed in the wheel.
          from kaos_core.config import ModuleSettings
          settings = KaosMCPSettings()
          assert isinstance(settings, ModuleSettings)
          assert hasattr(settings.__class__, 'from_context')
          assert hasattr(settings.__class__, 'resolve')
          # create_app constructs a FastMCP application with a runtime.
          from kaos_core import KaosRuntime
          app = create_app(KaosRuntime(), settings=settings)
          assert app.name == 'kaos-mcp'
          print(f'kaos-mcp {kaos_mcp.__version__}: public API OK')
          "
          # Exercise the CLI entrypoints.
          /tmp/smoke/bin/kaos-mcp --help
          /tmp/smoke/bin/kaos --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
